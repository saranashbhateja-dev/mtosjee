
name: Build Jee OS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Jee OS/**'
      - 'app.js'
      - 'index.html'
      - 'tracker.json'
      - 'playlist-durations.json'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: jee-os-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate Jee OS project
        id: project
        shell: bash
        run: |
          if [ -f "Jee OS/package.json" ]; then
            echo "dir=Jee OS" >> "$GITHUB_OUTPUT"
          elif [ -f "package.json" ] && [ -f "app.js" ] && [ -f "tracker.json" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "Jee OS project files were not found." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.project.outputs.dir }}/package.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Node dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install --no-audit --no-fund

      - name: Prepare Android web assets
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f app.js
          test -f tracker.json
          test -f playlist-durations.json

          rm -rf www
          mkdir -p www

          cp index.html app.js tracker.json \
            playlist-durations.json www/

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.saransh.jeeos",
            "appName": "Jee OS",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Create Android project if missing
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        working-directory: ${{ steps.project.outputs.dir }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jee-OS-debug-APK
          path: ${{ steps.project.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
