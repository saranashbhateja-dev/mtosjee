
name: Build Jee OS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Jee OS/**'
      - 'app.js'
      - 'index.html'
      - 'tracker.json'
      - 'playlist-durations.json'
      - 'curriculum.json'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/b.yml'

permissions:
  contents: read

concurrency:
  group: jee-os-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "Jee OS/package.json" ] && [ -f "Jee OS/index.html" ]; then
            echo "dir=Jee OS" >> "$GITHUB_OUTPUT"
          elif [ -f "package.json" ] && [ -f "index.html" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "::error::Project not found. Expected package.json and index.html in the repository root or Jee OS/."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Android SDK manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$MANAGER" ]; then
            MANAGER="$(find "$SDK/cmdline-tools" \
              -type f -name sdkmanager -perm /111 \
              2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$MANAGER" ] || [ ! -x "$MANAGER" ]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi

          echo "manager=$MANAGER" >> "$GITHUB_OUTPUT"
          echo "Android SDK manager found."

      - name: Accept Android SDK licenses
        shell: bash
        env:
          SDKMANAGER: ${{ steps.sdk.outputs.manager }}
        run: |
          set -euo pipefail

          # sdkmanager can finish successfully before yes exits.
          # Ignore the producer's expected broken pipe, not sdkmanager's status.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          RESULT=$?
          set -o pipefail

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed."
            exit "$RESULT"
          fi

          echo "Android SDK licenses accepted."

      - name: Install Android SDK packages
        shell: bash
        env:
          SDKMANAGER: ${{ steps.sdk.outputs.manager }}
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Node dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Validate project files
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f app.js
          test -f package.json

          node --check app.js

          for f in tracker.json playlist-durations.json curriculum.json; do
            if [ -f "$f" ]; then
              node -e \
                "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" \
                "$f"
            fi
          done

          echo "Project validation passed."

      - name: Prepare web assets
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf www
          mkdir -p www

          cp index.html app.js www/

          for f in tracker.json playlist-durations.json curriculum.json; do
            if [ -f "$f" ]; then
              cp "$f" www/
            fi
          done

      - name: Configure Capacitor
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const file = 'capacitor.config.json';
          let config = {};

          if (fs.existsSync(file)) {
            config = JSON.parse(fs.readFileSync(file, 'utf8'));
          }

          config.appId ||= 'com.saransh.jeeos';
          config.appName ||= 'Jee OS';
          config.webDir = 'www';

          fs.writeFileSync(
            file,
            JSON.stringify(config, null, 2) + '\n'
          );
          NODE

      - name: Verify Capacitor dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          npm ls @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Android platform if missing
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android project
        working-directory: ${{ steps.project.outputs.dir }}
        run: npx cap sync android

      - name: Verify Gradle wrapper
        working-directory: ${{ steps.project.outputs.dir }}/android
        shell: bash
        run: |
          set -euo pipefail

          test -f gradlew
          chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}/android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          ls -lh "$APK"
          echo "APK verification passed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jee-OS-debug-APK
          path: ${{ steps.project.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
