
name: Build Jee OS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Jee OS/**'
      - 'app.js'
      - 'index.html'
      - 'tracker.json'
      - 'playlist-durations.json'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/b.yml'

permissions:
  contents: read

concurrency:
  group: jee-os-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project
        id: project
        shell: bash
        run: |
          if [ -f "Jee OS/package.json" ]; then
            echo "dir=Jee OS" >> "$GITHUB_OUTPUT"
          elif [ -f "package.json" ] && [ -f "index.html" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Project or package.json not found."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Validate project files
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          node --check app.js

          if [ -f tracker.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('tracker.json','utf8'))"
          fi

          echo "Project validation passed."

      - name: Prepare web assets
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf www
          mkdir -p www

          cp index.html app.js www/

          for f in tracker.json playlist-durations.json curriculum.json; do
            if [ -f "$f" ]; then
              cp "$f" www/
            fi
          done

      - name: Configure Capacitor
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const file = 'capacitor.config.json';
          let config = {};

          if (fs.existsSync(file)) {
            config = JSON.parse(fs.readFileSync(file, 'utf8'));
          }

          config.appId ||= 'com.saransh.jeeos';
          config.appName ||= 'Jee OS';
          config.webDir = 'www';

          fs.writeFileSync(
            file,
            JSON.stringify(config, null, 2) + '\n'
          );
          NODE

      - name: Verify Capacitor
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          npm ls @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Android platform
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android project
        working-directory: ${{ steps.project.outputs.dir }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK successfully generated."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jee-OS-debug-APK
          path: ${{ steps.project.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
